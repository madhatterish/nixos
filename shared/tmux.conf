# Tmux Configuration for Server Management

# Set prefix to Ctrl-a (easier than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set-option -g history-limit 10000

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar styling
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=cyan]#S #[fg=white]| '
set -g status-right '#[fg=yellow]%H:%M #[fg=white]| #[fg=green]%Y-%m-%d'

# Window status styling
setw -g window-status-current-style fg=cyan,bold
setw -g window-status-style fg=white

# Pane border styling
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=cyan

# Enable 256 colors
set -g default-terminal "screen-256color"

# Don't rename windows automatically
set-option -g allow-rename off

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on
