# Hyprland Configuration
# Ported from niri.kdl

# Monitor configuration - auto-detect all connected monitors
monitor=,preferred,auto,1

# Environment variables
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = NIXOS_OZONE_WL,1

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }

    accel_profile = flat
    sensitivity = 0
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

# Decoration settings
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = true

    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1

    animation = windows, 1, 3, easeOutExpo
    animation = windowsOut, 1, 3, easeOutExpo
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, easeOutCubic
}

# Dwindle layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Master layout (alternative)
master {
    new_status = master
}

# Gestures
gestures {
    # workspace_swipe option removed - not supported in current Hyprland version
    # workspace_swipe = false
}

# Misc settings
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Named workspaces
workspace = 1, name:web
workspace = 2, name:code
workspace = 3, name:term
workspace = 4, name:admin
workspace = 5, name:chat
workspace = 6, name:detonate

# Window rules
windowrulev2 = opacity 0.95 0.95,class:^(kitty)$
windowrulev2 = workspace name:web,class:^(firefox|brave-browser)$
windowrulev2 = workspace name:code,class:^(code-url-handler|vscode|code-cursor|Code)$
windowrulev2 = workspace name:term,class:^(kitty)$

# Keybindings
$mod = SUPER

# Core bindings
bind = $mod, Q, exec, kitty
bind = $mod, C, killactive
bind = $mod, M, exit
bind = $mod, E, exec, kitty -e yazi
bind = $mod, R, exec, fuzzel
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, O, togglesplit

# Focus movement with arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Focus movement with vim keys
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows with Shift
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Multi-monitor support - focus monitor with Ctrl+Mod
bind = $mod CTRL, left, focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod CTRL, up, focusmonitor, u
bind = $mod CTRL, down, focusmonitor, d

bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, L, focusmonitor, r
bind = $mod CTRL, K, focusmonitor, u
bind = $mod CTRL, J, focusmonitor, d

# Multi-monitor support - move window to monitor with Ctrl+Shift+Mod
bind = $mod CTRL SHIFT, left, movewindow, mon:l
bind = $mod CTRL SHIFT, right, movewindow, mon:r
bind = $mod CTRL SHIFT, up, movewindow, mon:u
bind = $mod CTRL SHIFT, down, movewindow, mon:d

bind = $mod CTRL SHIFT, H, movewindow, mon:l
bind = $mod CTRL SHIFT, L, movewindow, mon:r
bind = $mod CTRL SHIFT, K, movewindow, mon:u
bind = $mod CTRL SHIFT, J, movewindow, mon:d

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move windows to workspaces
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Scroll through workspaces with mouse
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Resize windows
bind = $mod, minus, resizeactive, -10% 0
bind = $mod, equal, resizeactive, 10% 0
bind = $mod SHIFT, minus, resizeactive, 0 -10%
bind = $mod SHIFT, equal, resizeactive, 0 10%

# Fullscreen
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0

# Screenshots
bind = , Print, exec, grim ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png
bind = SHIFT, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png
bind = CTRL, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png

# Lock screen
bind = $mod SHIFT, Escape, exec, noctalia-lock

# Display/Dock configuration helper
bind = $mod, D, exec, kitty -e bash -c "~/nixos-config/shared/scripts/dock-displays.sh --auto; read -p 'Press Enter to close...'"

# Display configuration GUI
bind = $mod SHIFT, D, exec, wdisplays

# SSH Connection Launcher
bind = $mod, S, exec, ssh-launcher

# Kubernetes Context Switcher
bind = $mod, T, exec, k8s-context-switcher

# Move/resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Startup applications
# Noctalia shell handles panel, notifications, and more
exec-once = noctalia-shell
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
exec-once = waypaper --restore
