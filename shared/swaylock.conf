# Swaylock Configuration
# See https://github.com/swaywm/swaylock for more options

# Disable the default lock screen
daemonize

# Show the current date and time
clock
timestr=%H:%M
datestr=%Y-%m-%d

# Indicator appearance
indicator
indicator-radius=120
indicator-thickness=10
indicator-idle-visible

# Colors (Tokyo Night theme to match your Kitty terminal)
# Inside color when idle
inside-color=1a1b26ff
# Inside color when typing
inside-ver-color=7aa2f7ff
# Inside color when wrong password
inside-wrong-color=f7768eff
# Inside color when cleared
inside-clear-color=9ece6aff

# Ring color when idle
ring-color=33ccff80
# Ring color when typing
ring-ver-color=7aa2f788
# Ring color when wrong password
ring-wrong-color=f7768e88
# Ring color when cleared
ring-clear-color=9ece6a88

# Key highlight color
key-hl-color=bb9af7ff

# Backspace highlight color when password is wrong
bs-hl-color=f7768eff

# Separator color (line between indicator and text)
separator-color=00000000

# Text colors
text-color=c0caf5ff
text-clear-color=1a1b26ff
text-ver-color=1a1b26ff
text-wrong-color=1a1b26ff

# Layout text color
layout-text-color=c0caf5ff

# Font
font=FiraCode Nerd Font
font-size=14

# Effects
effect-blur=7x5
effect-vignette=0.5:0.5
fade-in=0.2

# Screenshot mode - takes a screenshot and blurs it as the background
screenshots

# Grace period - show unlock indicator after this many seconds
grace=2
grace-no-mouse
grace-no-touch

# Ignore empty passwords
ignore-empty-password

# Show failed attempts
show-failed-attempts
