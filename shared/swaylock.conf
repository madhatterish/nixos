# Swaylock-Effects Configuration
# Beautiful lock screen with blurred background and centered GUI

# Daemonize - don't block terminal
daemonize

# Indicator appearance - centered circular GUI
indicator
indicator-radius=120
indicator-thickness=10
indicator-idle-visible

# Clock display (shows above indicator)
clock
timestr=%H:%M
datestr=%a, %B %d

# Font settings
font=FiraCode Nerd Font
font-size=24

# Text prompts - show username and password instructions
text=Type password to unlock

# Show keyboard layout
show-keyboard-layout

# Show failed login attempts
show-failed-attempts

# Wallpaper image passed via --image argument from lock-screen.sh script
# (screenshots broken with wlroots 0.15+, so we use current waypaper wallpaper)
scaling=fill
effect-blur=10x7
effect-vignette=0.5:0.8
fade-in=0.3

# Fallback color if image fails (dark background)
color=1a1b26

# Grace period before requiring password
grace=2
grace-no-mouse
grace-no-touch

# Ignore empty password submissions
ignore-empty-password

# Line separator (invisible for clean look)
line-uses-ring
line-color=00000000

# Tokyo Night Color Scheme
# Background colors for different states
inside-color=1a1b26ff          # Idle
inside-ver-color=7aa2f7ff       # Verifying (typing)
inside-wrong-color=f7768eff     # Wrong password
inside-clear-color=9ece6aff     # Cleared

# Ring colors for different states
ring-color=33ccff80             # Idle
ring-ver-color=7aa2f788          # Verifying
ring-wrong-color=f7768e88        # Wrong
ring-clear-color=9ece6a88        # Cleared

# Text colors
text-color=c0caf5ff              # Default text
text-ver-color=1a1b26ff          # Text when typing
text-wrong-color=1a1b26ff        # Text when wrong
text-clear-color=1a1b26ff        # Text when cleared
text-caps-lock-color=f7768eff    # Caps lock warning

# Key highlight colors
key-hl-color=bb9af7ff            # Key press highlight
bs-hl-color=f7768eff             # Backspace highlight

# Layout text color
layout-text-color=c0caf5ff
layout-bg-color=1a1b2600

# Separator color (between indicator sections)
separator-color=00000000
